{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Learn Russian</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/duolingo.css' %}">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: #202F36;
            border-radius: 16px;
            border: 2px solid #37464f;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #131F24;
            border: 2px solid #37464f;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
        }

        label {
            display: none;
        }

        .btn-auth {
            width: 100%;
            margin-top: 20px;
            background-color: #58CC02;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-bottom: 4px solid #46a302;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <img src="{% static 'img/logo.png' %}" alt="Logo" width="150" style="margin-bottom: 20px;">
        <h2 style="margin-bottom: 30px;">Bon retour ! 👋</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-auth">SE CONNECTER</button>
        </form>

        <div style="margin: 20px 0; border-top: 1px solid #37464f; padding-top: 20px;">
            {% load socialaccount %}
            <a href="{% provider_login_url 'google' %}" style="text-decoration: none;">
                <button type="button" class="btn-auth"
                    style="background-color: #fff; color: #333; border-bottom-color: #ccc; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google" width="20">
                    Continuer avec Google
                </button>
            </a>
        </div>

        <p style="margin-top: 20px; color: #777;">
            Pas de compte ? <a href="{% url 'signup' %}" style="color: #1CB0F6;">S'inscrire</a>
        </p>
    </div>
</body>

</html>
