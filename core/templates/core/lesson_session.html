{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson</title>
    <link rel="stylesheet" href="{% static 'css/duolingo.css' %}">
    <style>
        .user-input:focus {
            border-color: #58CC02 !important;
            box-shadow: 0 0 0 4px rgba(88, 204, 2, 0.2);
        }

        .srs-btn {
            border: none;
            border-bottom: 4px solid;
            color: white;
            font-weight: bold;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .srs-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0;
            margin-bottom: 4px;
        }

        /* Diff Styles */
        ins {
            background-color: #e6ffec;
            color: #249d3c;
            text-decoration: none;
            padding: 2px 4px;
            border-radius: 4px;
        }

        del {
            background-color: #ffeef0;
            color: #d82e44;
            text-decoration: none;
            padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container lesson-container">
        <!-- Header -->
        <div class="progress-header">
            <div class="close-btn" onclick="window.location.href='/'">✕</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="question-area" id="questionArea">
            <!-- Content injected by JS -->
            <div style="text-align: center; margin-top: 50px;">
                Chargement de la leçon...
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="check-footer">
        <button class="btn-primary" id="checkBtn" disabled>Vérifier</button>
    </div>

    <!-- Audio Elements (hidden) - placeholders for real TTS later -->

    <script>
        const lessonId = "{{ lesson.id|default:'' }}";
        const mode = "{{ mode|default:'' }}";

        let apiUrl = '';
        if (lessonId) {
            apiUrl = `/api/lesson/${lessonId}/`;
        } else if (mode) {
            apiUrl = `/api/practice/${mode}/`;
        }

        let questions = [];
        let currentIndex = 0;
        let selectedOption = null;
        let isCheckState = true; // true = Check, false = Continue
        let currentQuestionStartTime = Date.now();

        const questionArea = document.getElementById('questionArea');
        const checkBtn = document.getElementById('checkBtn');
        const progressBar = document.getElementById('progressBar');

        // Fetch Questions
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status} ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (!data || !data.questions) {
                    throw new Error("Invalid data received from server");
                }
                questions = data.questions;
                if (questions.length === 0) {
                    questionArea.innerHTML = `<div style="text-align: center; margin-top: 50px;">Aucun vocabulaire trouvé.<br>Veuillez lancer 'populate_vocab'.</div>`;
                    return;
                }
                renderQuestion();
            })
            .catch(err => {
                console.error(err);
                questionArea.innerHTML = `<div style="text-align: center; color: #ff4b4b; margin-top: 50px;">
                    <h3>Erreur de chargement</h3>
                    <p>${err.message}</p>
                    <p style="font-size: 0.8rem; color: #777;">Check your internet connection or server logs.</p>
                </div>`;
            });

        function updateProgress() {
            const percent = ((currentIndex) / questions.length) * 100;
            progressBar.style.width = `${percent}%`;
        }

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                showCompletion();
                return;
            }

            const q = questions[currentIndex];
            questionArea.innerHTML = '';
            selectedOption = null;

            // Reset UI
            checkBtn.disabled = true;
            checkBtn.innerText = 'Vérifier';
            checkBtn.classList.remove('btn-continue');
            checkBtn.style.removeProperty('background-color');
            checkBtn.style.backgroundColor = '';
            checkBtn.style.display = 'block'; // Ensure visible

            const footer = document.querySelector('.check-footer');
            footer.style.removeProperty('background-color');
            footer.style.backgroundColor = '';
            footer.innerHTML = '<button class="btn-primary" id="checkBtn" disabled>Vérifier</button>'; // Reset footer content

            // Re-bind checkBtn since we wiped footer
            const newCheckBtn = document.getElementById('checkBtn');
            newCheckBtn.addEventListener('click', handleCheckClick);

            isCheckState = true;
            currentQuestionStartTime = Date.now();
            updateProgress();

            if (q.type === 'intro') {
                renderIntro(q);
                newCheckBtn.disabled = false;
                newCheckBtn.innerText = 'Compris';
            } else if (q.type === 'intro_word') {
                renderIntroWord(q);
                newCheckBtn.disabled = false;
                newCheckBtn.innerText = 'Compris';
            } else if (q.type === 'alphabet_grid') {
                renderAlphabetGrid(q);
                newCheckBtn.disabled = false;
                newCheckBtn.innerText = 'Apprendre';
            } else if (q.type === 'select_sound' || q.type === 'select_trans') {
                renderSelectSound(q);
            } else if (q.type === 'select_char') {
                renderSelectChar(q);
            } else if (q.type === 'select_translation' || q.type === 'select_word') {
                renderSelectTextOpt(q);
            } else if (q.type === 'flashcard') {
                renderFlashcard(q);
            } else if (q.type === 'input_text') {
                renderInputQuestion(q);
            }
        }

        function handleCheckClick() {
            const btn = document.getElementById('checkBtn');
            if (!isCheckState) {
                // Continue action
                currentIndex++;
                renderQuestion();
                return;
            }

            // Check Logic
            const q = questions[currentIndex];

            if (q.type === 'intro' || q.type === 'intro_word' || q.type === 'alphabet_grid') {
                currentIndex++;
                renderQuestion();
            } else if (q.type === 'input_text') {
                handleInputValidation(q);
            } else if (q.type === 'flashcard') {
                // handled internally
            } else {
                handleSelectionValidation(q);
            }
        }

        function renderInputQuestion(q) {
            questionArea.innerHTML = `
                <div style="text-align: center; max-width: 600px; margin: 0 auto;">
                    <h2 style="margin-bottom: 2rem;">Traduisez en Russe</h2>
                    
                     <div style="font-size: 2rem; margin-bottom: 3rem; color: #4b4b4b;">
                        "${q.prompt}"
                    </div>
                    
                    ${q.audio_url ? `<!-- Audio Hint if needed -->` : ''}

                    <textarea id="userAnswer" 
                        class="user-input" 
                        placeholder="Tapez en Russe..." 
                        rows="2"
                        style="width: 100%; font-size: 1.5rem; padding: 15px; border-radius: 15px; border: 2px solid #e5e5e5; resize: none; outline: none; transition: border-color 0.2s;"
                        oninput="checkInputState(this)"></textarea>
                    
                     <div style="margin-top: 10px; color: #888; font-size: 0.9rem;">
                        Appuyez sur Entrée pour valider
                    </div>
                </div>
            `;

            const input = document.getElementById('userAnswer');
            input.focus();
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('checkBtn').click();
                }
            });
        }

        window.checkInputState = function (el) {
            const btn = document.getElementById('checkBtn');
            btn.disabled = el.value.trim().length === 0;
            if (!btn.disabled) {
                btn.style.backgroundColor = '#58CC02';
                btn.style.color = 'white';
            } else {
                btn.style.backgroundColor = '';
                btn.style.color = '';
            }
        }

        function handleInputValidation(q) {
            const input = document.getElementById('userAnswer');
            const userText = input.value.trim();
            const btn = document.getElementById('checkBtn');

            // Disable input
            input.disabled = true;
            btn.disabled = true;
            btn.innerText = 'Validation...';

            // Call API
            fetch('/api/validate/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    word_id: q.id,
                    user_input: userText
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'ok') {
                        showInputFeedback(q, data, userText);
                    } else {
                        alert('Erreur: ' + data.message);
                        btn.disabled = false;
                        input.disabled = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert('Erreur réseau');
                    btn.disabled = false;
                    input.disabled = false;
                });
        }

        function showInputFeedback(q, result, userText) {
            const footer = document.querySelector('.check-footer');
            const btn = document.getElementById('checkBtn'); // This is the old check btn, we will replace footer content

            let resultColor = '';
            let title = '';

            if (result.is_correct && result.similarity === 100) {
                resultColor = '#d7ffb8'; // Light Green
                title = '<h3 style="color: #58CC02; margin: 0;">Parfait !</h3>';
                try { playSFX('success'); } catch (e) { }
            } else if (result.is_correct) {
                resultColor = '#fff8b8'; // Yellowish
                title = '<h3 style="color: #dcb300; margin: 0;">Presque !</h3>';
                try { playSFX('success'); } catch (e) { }
            } else {
                resultColor = '#ffdfe0'; // Redish
                title = '<h3 style="color: #FF4B4B; margin: 0;">Pas tout à fait...</h3>';
                try { playSFX('error'); } catch (e) { }
            }

            footer.style.backgroundColor = resultColor;

            // Generate Footer Content with SRS Buttons
            footer.innerHTML = `
                <div style="display: flex; flex-direction: column; width: 100%;">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <div style="background: white; border-radius: 50%; padding: 5px;">
                                ${result.is_correct ? '✅' : '❌'}
                            </div>
                            <div style="text-align: left;">
                                ${title}
                                ${!result.is_correct || result.similarity < 100 ? `
                                    <div style="color: #777; margin-top: 5px;">Correct: <b>${result.correct_answer}</b></div>
                                    <div style="font-size: 0.9rem; margin-top: 5px;">Diff: <span style="background: white; padding: 2px 5px; border-radius: 4px;">${result.diff_html}</span></div>
                                ` : ''}
                            </div>
                        </div>
                         <button class="audio-btn" style="font-size: 1.5rem;" onclick="playAudio('${result.correct_answer.replace("'", "\\'")}')">🔊</button>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <button class="srs-btn" onclick="submitSRS(${q.id}, 0)" style="background: #FF4B4B; border-bottom-color: #d41818;">Difficile</button>
                        <button class="srs-btn" onclick="submitSRS(${q.id}, 4)" style="background: #1CB0F6; border-bottom-color: #1693ce;">Moyen</button>
                        <button class="srs-btn" onclick="submitSRS(${q.id}, 5)" style="background: #58CC02; border-bottom-color: #46a302;">Facile</button>
                    </div>
                </div>
            `;

            // Play Audio of correct answer
            setTimeout(() => playAudio(result.correct_answer), 300);
        }

        window.submitSRS = function (wordId, quality) {
            fetch(`/api/word/${wordId}/status/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quality: quality })
            })
                .then(res => res.json())
                .then(data => {
                    // Determine if we repeat
                    // If quality == 0 (Fail) -> Repeat in this session? 
                    // SM2 updates DB, but for this session flow:
                    if (quality === 0) {
                        // Insert back into queue options
                        const q = questions[currentIndex];
                        const reInsertIdx = Math.min(currentIndex + 3, questions.length);
                        questions.splice(reInsertIdx, 0, q);
                    }

                    currentIndex++;
                    renderQuestion();
                })
                .catch(err => console.error(err));
        }

        function renderIntroWord(q) {
            questionArea.innerHTML = `
                <div style="text-align: center;">
                    <h2>Nouveau Mot !</h2>
                    <div style="font-size: 2rem; margin: 20px 0; color: #58CC02; font-weight: bold;">${q.word}</div>
                    <button class="audio-btn" style="font-size: 2rem; margin-bottom: 20px;" onclick="playAudio('${q.word.replace("'", "\\'")}')">🔊</button>
                    <div style="font-size: 1.5rem; color: #555;">${q.translation}</div>
                    <div style="margin-top: 10px; color: #aaa;">(${q.category === 'verb' ? 'Verbe' : 'Mot'})</div>
                    ${q.example ? `<div style="margin-top: 20px; font-style: italic; color: #1CB0F6; font-size: 1.2rem;">"${q.example}"</div>` : ''}
                </div>
            `;
            setTimeout(() => playAudio(q.word), 500);
        }

        function renderSelectTextOpt(q) {
            // Generic text selection for translation/word matching
            questionArea.innerHTML = `
                <h2>${q.prompt}</h2>
                 <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 2rem;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        ${q.main_word ? `<div class="big-char" style="font-size: 2.5rem;">${q.main_word}</div>` : ''}
                        ${q.type === 'select_translation' ? `<button class="audio-btn" style="font-size: 2rem;" onclick="playAudio('${q.main_word.replace("'", "\\'")}')">🔊</button>` : ''}
                    </div>
                    ${q.example && q.type === 'select_translation' ? `<div style="margin-top: 10px; font-style: italic; color: #888;">"${q.example}"</div>` : ''}
                </div>
                <div class="options-grid">
                    ${q.options.map((opt, idx) => `
                        <div class="option-btn" data-val="${opt}" onclick="selectOption(this, '${opt.replace("'", "\\'")}')" style="font-size: 1rem;">${opt}</div>
                    `).join('')}
                </div>
            `;
            if (q.type === 'select_translation') {
                setTimeout(() => playAudio(q.main_word), 500);
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSFX(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'success') {
                    // Ding sound
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                } else {
                    // Fail sound
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
                    gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.warn("Audio Context Error", e);
            }
        }

        function playAudio(text) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    if (/[а-яА-Я]/.test(text)) {
                        utterance.lang = 'ru-RU';
                    } else {
                        utterance.lang = 'en-US';
                    }
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {
                console.warn("Speech Synthesis Error", e);
            }
        }

        function renderIntro(q) {
            questionArea.innerHTML = `
                <div style="text-align: center;">
                    <h2>Nouvelle Lettre !</h2>
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <div class="big-char" style="margin: 30px 0; color: #58CC02;">${q.char}</div>
                        <button class="audio-btn" onclick="playAudio('${q.char}')">🔊</button>
                    </div>
                    <div style="font-size: 1.5rem; margin-bottom: 10px;">Nom : <b>${q.name}</b></div>
                    <div style="font-size: 1.5rem; color: #777;">Son : /${q.trans}/</div>
                    <div style="margin-top: 20px; font-style: italic;">"${q.desc}"</div>
                </div>
            `;
            setTimeout(() => playAudio(q.char), 500);
        }

        function renderSelectSound(q) {
            questionArea.innerHTML = `
                <h2>${q.prompt}</h2>
                 <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 2rem;">
                    <button class="audio-btn" style="font-size: 3rem; margin-right: 15px;" onclick="playAudio('${q.main_char}')">🔊</button>
                    <div class="big-char">${q.main_char}</div>
                </div>
                <div class="options-grid">
                    ${q.options.map((opt, idx) => `
                        <div class="option-btn" data-val="${opt}" onclick="selectOption(this, '${opt}')">${opt}</div>
                    `).join('')}
                </div>
            `;
            setTimeout(() => playAudio(q.main_char), 500);
        }

        function renderSelectChar(q) {
            questionArea.innerHTML = `
                <h2>${q.prompt}</h2>
                <div style="font-size: 3rem; margin-bottom: 2rem; color: #1CB0F6;">/${q.main_sound}/</div>
                <div class="options-grid">
                    ${q.options.map((opt, idx) => `
                        <div class="option-btn" data-val="${opt}" onclick="selectOption(this, '${opt}')">${opt}</div>
                    `).join('')}
                </div>
            `;
        }

        function renderFlashcard(q) {
            // Legacy flashcard
            questionArea.innerHTML = '<div>Flashcard Legacy (Unsupported in this refactor)</div>';
        }

        window.selectOption = function (el, val) {
            if (!isCheckState) return;
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedOption = val;
            const btn = document.getElementById('checkBtn');
            btn.disabled = false;
        }

        function handleSelectionValidation(q) {
            const btn = document.getElementById('checkBtn');
            const correct = q.correct;
            const isCorrect = selectedOption === correct;

            const options = document.querySelectorAll('.option-btn');
            options.forEach(btn => {
                const val = btn.dataset.val;
                if (val === correct) btn.classList.add('correct');
                if (val === selectedOption && !isCorrect) btn.classList.add('wrong');
            });

            if (isCorrect) {
                const footer = document.querySelector('.check-footer');
                footer.style.backgroundColor = '#d7ffb8';
                btn.style.backgroundColor = '#58CC02';
                btn.innerText = 'Continuer';
                try { playSFX('success'); } catch (e) { }
            } else {
                const footer = document.querySelector('.check-footer');
                footer.style.backgroundColor = '#ffdfe0';
                btn.style.backgroundColor = '#FF4B4B';
                btn.innerText = 'Continuer';
                try { playSFX('error'); } catch (e) { }
            }

            isCheckState = false;
            btn.disabled = false;
        }

        function renderAlphabetGrid(q) {
            document.getElementById('checkBtn').style.display = 'block';
            questionArea.innerHTML = `
                <div style="text-align: center;">
                    <h2>Alphabet Russe</h2>
                    <p style="color: #777; margin-bottom: 20px;">Voici toutes les lettres que vous allez apprendre.</p>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; max-width: 600px; margin: 0 auto;">
                        ${q.letters.map(l => `
                            <div style="background: #2b2b2b; padding: 10px; border-radius: 10px; border: 2px solid #373737; cursor: pointer;" onclick="playAudio('${l.char}')">
                                <div style="font-size: 1.5rem; color: #58CC02; font-weight: bold;">${l.char}</div>
                                <div style="font-size: 0.9rem; color: #aaa;">/${l.trans}/</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function showCompletion() {
            progressBar.style.width = '100%';
            questionArea.innerHTML = `
                <div style="text-align: center; margin-top: 50px;">
                    <div style="font-size: 5rem;">🎉</div>
                    <h2>Leçon terminée !</h2>
                    <p>Vous avez pratiqué ${questions.length} exercices.</p>
                </div>
            `;
            const btn = document.getElementById('checkBtn');
            btn.innerText = 'Terminer';
            btn.disabled = false;
            btn.style.backgroundColor = '#58CC02';
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.onclick = () => window.location.href = '/';
            document.querySelector('.check-footer').style.backgroundColor = '#fff';
        }

    </script>
</body>

</html>
