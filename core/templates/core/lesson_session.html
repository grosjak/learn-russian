{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson</title>
    <link rel="stylesheet" href="{% static 'css/duolingo.css' %}">
</head>

<body>
    <div class="container lesson-container">
        <!-- Header -->
        <div class="progress-header">
            <div class="close-btn" onclick="window.location.href='/'">✕</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="question-area" id="questionArea">
            <!-- Content injected by JS -->
            <div style="text-align: center; margin-top: 50px;">
                Chargement de la leçon...
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="check-footer">
        <button class="btn-primary" id="checkBtn" disabled>Vérifier</button>
    </div>

    <!-- Audio Elements (hidden) - placeholders for real TTS later -->

    <script>
        const lessonId = "{{ lesson.id|default:'' }}";
        const mode = "{{ mode|default:'' }}";

        let apiUrl = '';
        if (lessonId) {
            apiUrl = `/api/lesson/${lessonId}/`;
        } else if (mode) {
            apiUrl = `/api/practice/${mode}/`;
        }

        let questions = [];
        let currentIndex = 0;
        let selectedOption = null;
        let isCheckState = true; // true = Check, false = Continue

        const questionArea = document.getElementById('questionArea');
        const checkBtn = document.getElementById('checkBtn');
        const progressBar = document.getElementById('progressBar');

        // Fetch Questions
        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status} ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (!data || !data.questions) {
                    throw new Error("Invalid data received from server");
                }
                questions = data.questions;
                if (questions.length === 0) {
                    questionArea.innerHTML = `<div style="text-align: center; margin-top: 50px;">Aucun vocabulaire trouvé.<br>Veuillez lancer 'populate_vocab'.</div>`;
                    return;
                }
                renderQuestion();
            })
            .catch(err => {
                console.error(err);
                questionArea.innerHTML = `<div style="text-align: center; color: #ff4b4b; margin-top: 50px;">
                    <h3>Erreur de chargement</h3>
                    <p>${err.message}</p>
                    <p style="font-size: 0.8rem; color: #777;">Check your internet connection or server logs.</p>
                </div>`;
            });

        function updateProgress() {
            const percent = ((currentIndex) / questions.length) * 100;
            progressBar.style.width = `${percent}%`;
        }

        function renderQuestion() {
            if (currentIndex >= questions.length) {
                showCompletion();
                return;
            }

            const q = questions[currentIndex];
            questionArea.innerHTML = '';
            selectedOption = null;
            checkBtn.disabled = true;
            checkBtn.innerText = 'Vérifier';
            checkBtn.classList.remove('btn-continue');
            checkBtn.style.removeProperty('background-color');
            checkBtn.style.backgroundColor = '';
            const footer = document.querySelector('.check-footer');
            footer.style.removeProperty('background-color');
            footer.style.backgroundColor = '';
            isCheckState = true;
            updateProgress();

            if (q.type === 'intro') {
                renderIntro(q);
                checkBtn.disabled = false;
                checkBtn.innerText = 'Compris';
            } else if (q.type === 'select_sound' || q.type === 'select_trans') {
                renderSelectSound(q);
            } else if (q.type === 'select_char') {
                renderSelectChar(q);
            } else if (q.type === 'flashcard') {
                renderFlashcard(q);
            }
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                // Cancel previous
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.9; // Slightly slower for learning
                window.speechSynthesis.speak(utterance);
            }
        }

        function renderIntro(q) {
            questionArea.innerHTML = `
                <div style="text-align: center;">
                    <h2>Nouvelle Lettre !</h2>
                    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                        <div class="big-char" style="margin: 30px 0; color: #58CC02;">${q.char}</div>
                        <button class="audio-btn" onclick="playAudio('${q.char}')">🔊</button>
                    </div>
                    <div style="font-size: 1.5rem; margin-bottom: 10px;">Nom : <b>${q.name}</b></div>
                    <div style="font-size: 1.5rem; color: #777;">Son : /${q.trans}/</div>
                    <div style="margin-top: 20px; font-style: italic;">"${q.desc}"</div>
                </div>
            `;
            // Auto-play introduction
            setTimeout(() => playAudio(q.char), 500);
        }

        function renderSelectSound(q) {
            // Letter -> Sound
            questionArea.innerHTML = `
                <h2>${q.prompt}</h2>
                 <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 2rem;">
                    <button class="audio-btn" style="font-size: 3rem; margin-right: 15px;" onclick="playAudio('${q.main_char}')">🔊</button>
                    <div class="big-char">${q.main_char}</div>
                </div>
                <div class="options-grid">
                    ${q.options.map((opt, idx) => `
                        <div class="option-btn" data-val="${opt}" onclick="selectOption(this, '${opt}')">${opt}</div>
                    `).join('')}
                </div>
            `;
            // Auto-play question audio
            setTimeout(() => playAudio(q.main_char), 500);
        }

        function renderSelectChar(q) {
            // Sound -> Letter
            questionArea.innerHTML = `
                <h2>${q.prompt}</h2>
                <div style="font-size: 3rem; margin-bottom: 2rem; color: #1CB0F6;">/${q.main_sound}/</div>
                <div class="options-grid">
                    ${q.options.map((opt, idx) => `
                        <div class="option-btn" data-val="${opt}" onclick="selectOption(this, '${opt}')">${opt}</div>
                    `).join('')}
                </div>
            `;
        }

        function renderFlashcard(q) {
            checkBtn.style.display = 'none'; // Hide default check button

            questionArea.innerHTML = `
                <div class="flashcard-container">
                    <!-- Front Side -->
                    <div id="cardFront">
                        <h2 style="color: #777; margin-bottom: 2rem;">Comment dit-on ?</h2>
                        <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 3rem;">
                            <div class="big-char" style="font-size: 3.5rem;">${q.front}</div>
                            <button class="audio-btn" style="width: 50px; height: 50px; font-size: 1.5rem;" onclick="playAudio('${q.front}')">🔊</button>
                        </div>
                        
                        <button class="btn-primary" onclick="revealCard()" style="width: 100%; max-width: 300px; margin: 0 auto; display: block;">
                            Révéler la réponse
                        </button>
                    </div>

                    <!-- Back Side (Hidden initially) -->
                    <div id="cardBack" style="display: none; text-align: center;">
                        <div style="margin-bottom: 2rem;">
                            <div style="font-size: 1.5rem; color: #58CC02; font-weight: bold; margin-bottom: 0.5rem;">${q.back}</div>
                            <div style="font-size: 1.2rem; color: #1CB0F6; margin-bottom: 1rem;">/${q.trans}/</div>
                            
                            <!-- Breakdown -->
                            <div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;">
                                ${q.breakdown.map(b => `
                                    <div style="display: flex; flex-direction: column; align-items: center; background: #37464f; padding: 5px 8px; border-radius: 8px;">
                                        <div style="font-size: 1.2rem; font-weight: bold; color: #fff;">${b.char}</div>
                                        <div style="font-size: 0.8rem; color: #aaa;">${b.sound}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px;">
                            <button class="btn-primary" onclick="rateCard(false)" style="background-color: #FF4B4B; border-bottom: 4px solid #d41818;">
                                ❌ Je ne savais pas
                            </button>
                            <button class="btn-primary" onclick="rateCard(true)" style="background-color: #58CC02;">
                                ✅ Je savais
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Auto play audio on show
            setTimeout(() => playAudio(q.front), 300);
        }

        window.revealCard = function () {
            document.getElementById('cardFront').style.display = 'none';
            document.getElementById('cardBack').style.display = 'block';
        }

        window.rateCard = function (known) {
            const q = questions[currentIndex];

            // Call API to persist status (Fire and forget, but logging error if needed)
            if (q.id) {
                fetch(`/api/word/${q.id}/status/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ known: known })
                }).catch(err => console.error('Failed to update status', err));
            }

            if (!known) {
                // If unknown, re-insert card 3 positions later (or at end)
                const reInsertIdx = Math.min(currentIndex + 4, questions.length);
                questions.splice(reInsertIdx, 0, q);
            } else if (known && q.is_revision) {
                // In revision mode, if known/fixed, we simply move on (it won't come back)
                // Nothing special to do, just don't re-insert.
            }

            // Restore default Check button visibility for next question
            checkBtn.style.display = 'block';

            currentIndex++;
            renderQuestion();
        }

        window.selectOption = function (el, val) {
            if (!isCheckState) return; // Locked after check

            // Deselect all
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));

            el.classList.add('selected');
            selectedOption = val;
            checkBtn.disabled = false;
        }

        checkBtn.addEventListener('click', () => {
            if (!isCheckState) {
                // Continue action
                currentIndex++;
                renderQuestion();
                return;
            }

            // Check Logic
            const q = questions[currentIndex];

            if (q.type === 'intro') {
                currentIndex++;
                renderQuestion();
            } else {
                handleValidation(q);
            }
        });

        function handleValidation(q) {
            const correct = q.correct;
            const isCorrect = selectedOption === correct;

            const options = document.querySelectorAll('.option-btn');
            options.forEach(btn => {
                const val = btn.dataset.val;
                if (val === correct) btn.classList.add('correct');
                if (val === selectedOption && !isCorrect) btn.classList.add('wrong');
            });

            if (isCorrect) {
                // Success visual
                const footer = document.querySelector('.check-footer');
                footer.style.backgroundColor = '#d7ffb8';
                checkBtn.style.backgroundColor = '#58CC02';
                checkBtn.innerText = 'Continuer';
            } else {
                // Fail visual
                const footer = document.querySelector('.check-footer');
                footer.style.backgroundColor = '#ffdfe0';
                checkBtn.style.backgroundColor = '#FF4B4B';
                checkBtn.innerText = 'Continuer';
            }

            // Switch to continue mode
            isCheckState = false;
            checkBtn.disabled = false;
        }

        function showCompletion() {
            progressBar.style.width = '100%';
            questionArea.innerHTML = `
                <div style="text-align: center; margin-top: 50px;">
                    <div style="font-size: 5rem;">🎉</div>
                    <h2>Leçon terminée !</h2>
                    <p>Vous avez pratiqué ${questions.length} exercices.</p>
                </div>
            `;
            checkBtn.innerText = 'Terminer';
            checkBtn.disabled = false;
            checkBtn.style.backgroundColor = '#58CC02';
            checkBtn.onclick = () => window.location.href = '/';
            document.querySelector('.check-footer').style.backgroundColor = '#fff';
        }


    </script>
</body>

</html>
