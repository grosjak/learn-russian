{% extends 'core/base_app.html' %}

{% block content %}
<div class="container" style="display: flex; flex-direction: column; justify-content: center; min-height: 80vh;">
    <!-- Header Removed (Handled by Base) -->
    <div style="margin-top: 10px;"></div>

    <h1 style="font-size: 2.5rem; margin-bottom: 3rem; color: #fff;">Vocabulaire</h1>

    <div style="display: flex; flex-direction: column; gap: 1.5rem; width: 100%;">
        <a href="{% url 'practice' 'words' %}" class="menu-btn">
            <span style="font-size: 2rem; margin-right: 15px;">📖</span>
            Mots
        </a>

        <a href="{% url 'practice' 'verbs' %}" class="menu-btn">
            <span style="font-size: 2rem; margin-right: 15px;">🏃</span>
            Verbes
        </a>

        <a href="{% url 'practice' 'audio_challenge' %}" class="menu-btn"
            style="border-color: #6A1B9A; box-shadow: 0 4px 0 #4A148C;">
            <span style="font-size: 2rem; margin-right: 15px;">🎧</span>
            Ghost Mode
        </a>

        <a href="{% url 'grammar_practice' %}" class="menu-btn"
            style="border-color: #00897B; box-shadow: 0 4px 0 #004D40;">
            <span style="font-size: 2rem; margin-right: 15px;">🧪</span>
            Labo Genre
        </a>

        <!-- Revision Button -->
        <a href="{% url 'revision_list' %}" class="menu-btn"
            style="border-color: #FF4B4B; box-shadow: 0 4px 0 #d41818;">
            <span style="font-size: 2rem; margin-right: 15px;">🧠</span>
            Révisions
        </a>
    </div>
</div>

<style>
    /* Reuse menu-btn style from home, make sure it's accessible or copied */
    .menu-btn {
        background-color: var(--card-bg);
        border: 2px solid var(--duo-green);
        color: white;
        padding: 1.5rem;
        border-radius: 16px;
        font-size: 1.5rem;
        font-weight: bold;
        text-decoration: none;
        display: flex;
        align-items: center;
        box-shadow: 0 4px 0 var(--duo-green-shadow);
        transition: transform 0.1s, background 0.2s;
    }

    .menu-btn:active {
        transform: translateY(4px);
        box-shadow: none;
    }
</style>
{% endblock %}
