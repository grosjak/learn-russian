{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprendre les langues</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="app-header"
        style="background: #202F36; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #37464f; margin-bottom: 20px;">
        <!-- Home Button -->
        <a href="{% url 'home' %}" class="nav-btn"
            style="text-decoration: none; color: white; font-weight: bold; font-size: 1rem; display: flex; align-items: center; gap: 8px; background: #37464f; padding: 8px 16px; border-radius: 12px; border: 2px solid #4b5b64; transition: all 0.2s;">
            <span>🏠</span>
            <span>Menu</span>
        </a>

        <!-- Navigation Links -->
        <a href="{% url 'vocabulary' %}" class="nav-btn">
            <span>📖</span>
            <span class="nav-label">Mots</span>
        </a>

        {% if request.session.target_language == 'ru' or not request.session.target_language %}
        <a href="{% url 'stories_list' %}" class="nav-btn">
            <span>📚</span>
            <span class="nav-label">Lectures</span>
        </a>
        <a href="{% url 'roadmap' %}" class="nav-btn">
            <span>🗺️</span>
            <span class="nav-label">Parcours</span>
        </a>
        {% endif %}

        {% if request.session.target_language == 'en' %}
        <a href="{% url 'english_lab' %}" class="nav-btn">
            <span>🇬🇧</span>
            <span class="nav-label">Labo</span>
        </a>
        {% endif %}
    </div>

    <style>
        .nav-links-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            /* Allow wrapping on small screens */
            justify-content: center;
        }

        .nav-btn {
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #37464f;
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px solid #4b5b64;
            transition: all 0.2s;
        }

        @media (max-width: 600px) {
            .nav-links-container {
                gap: 8px;
            }

            .nav-btn {
                padding: 6px 10px;
                font-size: 0.9rem;
            }

            .nav-label {
                /* Optional: Hide text on very small screens if needed, 
                       but wrapping is usually better */
            }
        }
    </style>

    <!-- Title Removed as requested -->

    <!-- Language Button -->
    <a href="{% url 'select_language' %}" class="nav-btn"
        style="text-decoration: none; color: white; font-weight: bold; font-size: 1rem; display: flex; align-items: center; gap: 8px; background: #37464f; padding: 8px 16px; border-radius: 12px; border: 2px solid #4b5b64; transition: all 0.2s;">
        <span>🌍</span>
        <span>Langue</span>
    </a>
    </div>

    <style>
        .nav-btn:hover {
            background: #4b5b64 !important;
            transform: translateY(-2px);
        }

        .nav-btn:active {
            transform: translateY(0);
        }
    </style>

    <div class="app-container">
        {% block content %}
        {% endblock %}
    </div>


</body>

</html>
